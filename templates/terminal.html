<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Terminal de Contenção O5</title>

    <!-- Importando o núcleo visual do xterm.js da nuvem -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

    <style>
        /* 1. O ABISMO NEGRO (Fundo e Tipografia) */
        body {
            margin: 0;
            background-color: #050505;
            /* Preto quase absoluto */
            color: #ffb000;
            /* O clássico Âmbar de terminais militares */
            font-family: 'Courier New', monospace;
            /* Fonte monoespaçada de sistema */
            display: flex;
            height: 100vh;
            overflow: hidden;
            /* Impede a rolagem, prende o usuário na tela */
        }

        /* 2. GEOMETRIA SAGRADA: O Layout Divino */
        #sistema-operacional {
            display: flex;
            width: 100vw;
        }

        /* O Terminal Principal recebe exatamente 61.8% do espaço (Proporção Áurea) */
        #zona-terminal {
            width: 61.8vw;
            padding: 34px;
            /* Fibonacci: 34px */
            box-shadow: inset 0 0 55px rgba(255, 176, 0, 0.05);
            /* Fibonacci: 55px */
        }

        /* O Painel Lateral recebe os 38.2% restantes */
        #zona-anomalia {
            width: 38.2vw;
            border-left: 1px solid rgba(255, 176, 0, 0.3);
            padding: 21px;
            /* Fibonacci: 21px */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 3. A ESTÉTICA DO SOBRENATURAL */
        h1 {
            font-size: 55px;
            /* Fibonacci */
            letter-spacing: 8px;
            /* Fibonacci */
            margin: 0;
            text-transform: uppercase;
            animation: pulsacao-divina 1.618s infinite alternate;
            /* O tempo do pulso usa o valor de Phi */
        }

        .texto-sistema {
            font-size: 13px;
            /* Fibonacci */
            line-height: 1.618;
            /* A altura da linha das letras é regida por Phi */
            text-align: center;
            color: #885d00;
        }

        /* O Glitch matemático (simulando instabilidade da contenção) */
        @keyframes pulsacao-divina {
            0% {
                text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
                opacity: 0.9;
            }

            50% {
                text-shadow: -2px 0 #ff0000, 2px 0 #00ffff;
                opacity: 1.0;
            }

            100% {
                text-shadow: 2px 0 #ffb000, -2px 0 #ffb000;
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>

    <div id="sistema-operacional">
        <!-- Aqui é onde o terminal real será injetado pelo JavaScript -->
        <div id="zona-terminal"></div>

        <!-- Área lateral para exibir fotos e status das anomalias no futuro -->
        <div id="zona-anomalia">
            <h1>ANOMALIA OS</h1>
            <p class="texto-sistema">
                GEOMETRIA DE CONTENÇÃO ATIVA<br>
                CÓDIGO DE SEQUÊNCIA: 8, 13, 21, 34, 55<br>
                PROPORÇÃO DE REALIDADE: 1.618033
            </p>
        </div>
    </div>

    <!-- Importando o motor do xterm.js -->
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

    <script>
        /* 1. A ENGENHARIA DO XTERM.JS */
        const terminal = new Terminal({
            cursorBlink: true,
            cursorStyle: 'block',
            fontSize: 21,
            fontFamily: 'Courier New',
            scrollback: 9999, // Guarda até 9999 linhas na memória, permitindo usar a barra de rolagem
            convertEol: true, // Força a quebra de linha (End Of Line) a funcionar corretamente
            theme: {
                background: '#050505',
                foreground: '#ffb000',
                cursor: '#ffb000'
            }
        });

        // Plugando o FitAddon para evitar quebra bizarra de palavras
        const fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);

        terminal.open(document.getElementById('zona-terminal'));

        // Força o terminal a calcular a matemática da tela e encaixar o texto
        fitAddon.fit();

        // Se o usuário redimensionar a janela do navegador, o terminal recalcula
        window.addEventListener('resize', () => {
            fitAddon.fit();
        });

        terminal.writeln('Iniciando sequência de ancoragem de realidade...');

        /* 2. O DESIGN DE SOM (Blindado contra bloqueios do navegador) */
        let audioCtx; // Começa dormente, sem ativar o sistema

        function iniciarAudio() {
            if (!audioCtx) {
                // Só cria o motor de som se ele não existir ainda
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function tocarBipe(freq = 800, tipo = 'sine', duracao = 0.05, volume = 0.1) {
            if (!audioCtx) return; // Se o áudio não foi iniciado, não faz nada
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();

            oscilador.type = tipo;
            oscilador.frequency.value = freq;

            ganho.gain.setValueAtTime(volume, audioCtx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);

            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);

            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracao);
        }

        /* 3. O EFEITO MÁQUINA DE ESCREVER */
        let digitando = false;

        function maquinaDeEscrever(texto, velocidade, callback) {
            let i = 0;
            digitando = true;

            function digitarCaractere() {
                if (i < texto.length) {
                    let char = texto.charAt(i);

                    if (char === '\n') {
                        terminal.write('\r\n');
                    } else {
                        terminal.write(char);
                        if (char !== ' ' && i % 3 === 0) tocarBipe(1200, 'square', 0.02, 0.03);
                    }

                    i++;
                    setTimeout(digitarCaractere, velocidade);
                } else {
                    digitando = false;
                    if (callback) callback();
                }
            }
            digitarCaractere();
        }

        /* 4. A SINAPSE COM O BANCO DE DADOS */
        let linhaAtual = '';

        terminal.onKey(e => {
            if (digitando) return;

            // O GATILHO: Liga o áudio de forma segura assim que a primeira tecla é pressionada
            iniciarAudio();

            const press = e.key;
            const ev = e.domEvent;

            tocarBipe(400, 'triangle', 0.03, 0.05);

            if (ev.keyCode === 13) {
                terminal.write('\r\n');
                const comando = linhaAtual.trim().toUpperCase();

                if (comando === '') {
                    terminal.write('\r\n>_ ');
                    return;
                }

                terminal.writeln('\x1b[36m[SISTEMA] INICIANDO VARREDURA POR: ' + comando + '...\x1b[0m');
                digitando = true;

                fetch('/api/buscar/' + comando + '/')
                    .then(resposta => resposta.json())
                    .then(dados => {
                        let saida = '';

                        if (dados.status === 'sucesso') {
                            tocarBipe(200, 'sawtooth', 0.8, 0.1);
                            saida += `\r\n\x1b[32m=== ARQUIVO ENCONTRADO ===\x1b[0m\n`;
                            saida += `\x1b[33mDESIGNACAO:\x1b[0m ${dados.designacao}\n`;
                            saida += `\x1b[33mNOME DE REGISTRO:\x1b[0m ${dados.nome_popular}\n`;
                            saida += `\x1b[33mCLASSE DE CONTENCAO:\x1b[0m ${dados.classe}\n`;
                            saida += `\x1b[33mSTATUS ATUAL:\x1b[0m ${dados.status_contencao}\n\n`;
                            saida += `\x1b[31m[PROCEDIMENTOS ESPECIAIS DE CONTENCAO]\x1b[0m\n`;
                            saida += `${dados.procedimentos}\n`;
                        } else {
                            tocarBipe(150, 'square', 1.0, 0.2);
                            saida += `\r\n\x1b[31m[ERRO CRITICO] ${dados.mensagem}\x1b[0m\n`;
                        }

                        maquinaDeEscrever(saida, 5, () => {
                            linhaAtual = '';
                            terminal.write('\r\n>_ ');
                        });
                    })
                    .catch(erro => {
                        terminal.writeln('\x1b[31m[FALHA DE COMUNICACAO COM O NUCLEO DO BANCO DE DADOS]\x1b[0m');
                        digitando = false;
                        linhaAtual = '';
                        terminal.write('\r\n>_ ');
                    });

            } else if (ev.keyCode === 8) {
                if (linhaAtual.length > 0) {
                    linhaAtual = linhaAtual.slice(0, -1);
                    terminal.write('\b \b');
                }
            } else {
                linhaAtual += press;
                terminal.write(press);
            }
        });
    </script>
</body>

</html>
