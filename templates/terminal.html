<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Terminal de Contenção O5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #ffb000;
            font-family: 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sistema-operacional {
            display: flex;
            width: 100vw;
        }

        /* CORREÇÃO DO VAZAMENTO: O terminal agora respeita estritamente o espaço */
        #container-terminal {
            width: 61.8vw;
            height: 100vh;
            padding: 20px 40px 20px 20px; /* Mais espaço na direita para o texto não encostar na linha */
            box-sizing: border-box;
            box-shadow: inset 0 0 55px rgba(255, 176, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        #zona-terminal {
            flex: 1;
            width: 100%;
            overflow: hidden;
        }

        .xterm-viewport::-webkit-scrollbar { display: none; }
        .xterm-viewport { -ms-overflow-style: none; scrollbar-width: none; }

        #zona-anomalia {
            width: 38.2vw;
            border-left: 1px solid rgba(255, 176, 0, 0.3);
            padding: 34px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: linear-gradient(90deg, rgba(255,176,0,0.02) 0%, rgba(0,0,0,0) 100%);
        }

        h1 {
            font-size: 45px;
            letter-spacing: 8px;
            margin: 0;
            text-transform: uppercase;
            animation: pulsacao-divina 1.618s infinite alternate;
            text-align: center;
        }

        .texto-sistema { font-size: 13px; line-height: 1.618; text-align: center; color: #885d00; }

        @keyframes pulsacao-divina {
            0% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; opacity: 0.9; }
            50% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; opacity: 1.0; }
            100% { text-shadow: 2px 0 #ffb000, -2px 0 #ffb000; opacity: 0.8; }
        }

        /* VISUALIZADOR DE MÍDIA MILITAR */
        .janela-documento {
            width: 100%;
            border: 1px solid #ffb000;
            background-color: #0a0a0a;
            box-shadow: 5px 5px 0px rgba(255, 176, 0, 0.15);
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            animation: boot-janela 0.3s ease-out;
            margin-bottom: 20px;
        }
        
        .janela-cabecalho { background-color: #ffb000; color: #050505; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; font-size: 14px; }
        .janela-corpo { padding: 15px; position: relative; }
        .carimbo-confidencial { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: rgba(255, 0, 0, 0.7); border: 3px solid rgba(255, 0, 0, 0.7); padding: 5px 15px; font-size: 24px; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 0 0 5px rgba(255,0,0,0.5); box-shadow: inset 0 0 10px rgba(255,0,0,0.3); }
        .moldura-midia { border: 1px dashed #555; background: #000; padding: 3px; position: relative; }
        .moldura-midia img { width: 100%; display: block; filter: grayscale(100%) sepia(100%) hue-rotate(10deg) saturate(300%) contrast(150%); opacity: 0.9; }
        .metadados-arquivo { margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; font-size: 12px; color: #885d00; line-height: 1.4; }
        .metadados-arquivo span { color: #ffb000; }
        @keyframes boot-janela { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="sistema-operacional">
        <div id="container-terminal">
            <div id="zona-terminal"></div>
        </div>

        <div id="zona-anomalia">
            <h1>ANOMALIA OS</h1>
            <p class="texto-sistema">
                GEOMETRIA DE CONTENÇÃO ATIVA<br>
                CÓDIGO DE SEQUÊNCIA: 8, 13, 21, 34, 55<br>
                PROPORÇÃO DE REALIDADE: 1.618033
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

    <script>
        const terminal = new Terminal({
            cursorBlink: true,
            cursorStyle: 'block',
            fontSize: 21,
            fontFamily: 'Courier New',
            scrollback: 9999,
            convertEol: true,
            theme: { background: '#050505', foreground: '#ffb000', cursor: '#ffb000' }
        });

        const fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.open(document.getElementById('zona-terminal'));

        // O Atraso cirúrgico para forçar o xterm a calcular os limites corretamente
        setTimeout(() => {
            fitAddon.fit();
            terminal.writeln('Iniciando sequência de ancoragem de realidade...');
            terminal.writeln('\x1b[31m[AVISO] ALINHAMENTO MATEMÁTICO PHI ESTABELECIDO.\x1b[0m');
            terminal.writeln('Aguardando input do operador (Ex: digite SCP-002)...');
            terminal.write('\r\n>_ ');
        }, 100);

        window.addEventListener('resize', () => { fitAddon.fit(); });

        let audioCtx;
        function iniciarAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function tocarBipe(freq = 800, tipo = 'sine', duracao = 0.05, volume = 0.1) {
            if (!audioCtx) return;
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();
            oscilador.type = tipo;
            oscilador.frequency.value = freq;
            ganho.gain.setValueAtTime(volume, audioCtx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracao);
        }

        let digitando = false;
        function maquinaDeEscrever(texto, velocidade, callback) {
            let i = 0;
            digitando = true;
            function digitarCaractere() {
                if (i < texto.length) {
                    let char = texto.charAt(i);
                    if (char === '\n') {
                        terminal.write('\r\n');
                    } else {
                        terminal.write(char);
                        if (char !== ' ' && i % 3 === 0) tocarBipe(1200, 'square', 0.02, 0.03);
                    }
                    i++;
                    setTimeout(digitarCaractere, velocidade);
                } else {
                    digitando = false;
                    if (callback) callback();
                }
            }
            digitarCaractere();
        }

        let linhaAtual = '';
        terminal.onKey(e => {
            if (digitando) return;
            iniciarAudio();
            const press = e.key;
            const ev = e.domEvent;
            tocarBipe(400, 'triangle', 0.03, 0.05);

            if (ev.keyCode === 13) {
                terminal.write('\r\n');
                const comando = linhaAtual.trim().toUpperCase();
                if (comando === '') {
                    terminal.write('\r\n>_ ');
                    return;
                }

                terminal.writeln('\x1b[36m[SISTEMA] INICIANDO VARREDURA POR: ' + comando + '...\x1b[0m');
                digitando = true;

                // O CÓDIGO FETCH COM A INJEÇÃO DE IMAGENS MILITARES
                fetch('/api/buscar/' + comando + '/')
                    .then(resposta => resposta.json())
                    .then(dados => {
                        let saida = '';
                        const painelLateral = document.getElementById('zona-anomalia');
                        
                        if (dados.status === 'sucesso') {
                            tocarBipe(200, 'sawtooth', 0.8, 0.1);
                            
                            if (dados.imagem_url) {
                                painelLateral.innerHTML = `
                                    <div class="janela-documento">
                                        <div class="janela-cabecalho">
                                            <span>VISUALIZADOR_DE_MÍDIA.EXE</span>
                                            <span>[X]</span>
                                        </div>
                                        <div class="janela-corpo">
                                            <div class="carimbo-confidencial">CLASSIFICADO // NV 4</div>
                                            <div class="moldura-midia">
                                                <img src="${dados.imagem_url}" alt="Registro Visual da Entidade">
                                            </div>
                                            <div class="metadados-arquivo">
                                                <p>ID_ANEXO.......: <span>IMG-${dados.designacao}</span></p>
                                                <p>DEPARTAMENTO...: <span>PESQUISA E CIÊNCIA APLICADA</span></p>
                                                <p>ORIGEM_DADOS...: <span>FUNDAÇÃO SCP</span></p>
                                                <p>DATA_REGISTRO..: <span>[REDIGIDO]</span></p>
                                            </div>
                                        </div>
                                    </div>
                                    <h1 style="font-size: 30px;">${dados.designacao}</h1>
                                `;
                            } else {
                                painelLateral.innerHTML = `
                                    <div class="janela-documento" style="border-color: #ff0000;">
                                        <div class="janela-cabecalho" style="background-color: #ff0000; color: #fff;">
                                            <span>ERRO_SISTEMA.EXE</span>
                                            <span>[X]</span>
                                        </div>
                                        <div class="janela-corpo">
                                            <div class="carimbo-confidencial" style="transform: translate(-50%, -50%) rotate(0deg); border: none;">MÍDIA AUSENTE</div>
                                            <div class="moldura-midia" style="height: 150px; display: flex; align-items: center; justify-content: center; border-color: #ff0000;">
                                                <span style="color: #ff0000;">[ ARQUIVO CORROMPIDO OU EXPURGADO ]</span>
                                            </div>
                                            <div class="metadados-arquivo">
                                                <p>STATUS_BUSCA...: <span style="color: #ff0000;">FALHA CRÍTICA</span></p>
                                            </div>
                                        </div>
                                    </div>
                                    <h1 style="font-size: 30px; color: #ff0000;">${dados.designacao}</h1>
                                `;
                            }

                            saida += `\r\n\x1b[32m=== ACESSO CONCEDIDO ===\x1b[0m\n`;
                            saida += `\x1b[33mDESIGNACAO:\x1b[0m ${dados.designacao}\n`;
                            saida += `\x1b[33mNOME DE REGISTRO:\x1b[0m ${dados.nome_popular}\n`;
                            saida += `\x1b[33mCLASSE DE CONTENCAO:\x1b[0m ${dados.classe}\n`;
                            saida += `\x1b[33mSTATUS ATUAL:\x1b[0m ${dados.status_contencao}\n\n`;
                            saida += `\x1b[31m[ARQUIVO CONFIDENCIAL]\x1b[0m\n`;
                            saida += `${dados.procedimentos}\n`;
                            saida += `\n\x1b[32m=== FIM DO ARQUIVO ===\x1b[0m\n`;
                            
                        } else {
                            tocarBipe(150, 'square', 1.0, 0.2);
                            saida += `\r\n\x1b[31m[ERRO CRITICO] ${dados.mensagem}\x1b[0m\n`;
                            painelLateral.innerHTML = `<h1 style="color: #ff0000; animation: pulsacao-divina 0.5s infinite alternate;">ACESSO NEGADO</h1>`;
                        }
                        
                        maquinaDeEscrever(saida, 5, () => {
                            linhaAtual = '';
                            terminal.write('\r\n>_ ');
                        });
                    })
                    .catch(erro => {
                        terminal.writeln('\r\n\x1b[31m[FALHA DE COMUNICACAO COM O NUCLEO DO BANCO DE DADOS]\x1b[0m');
                        digitando = false;
                        linhaAtual = '';
                        terminal.write('\r\n>_ ');
                    });

            } else if (ev.keyCode === 8) {
                if (linhaAtual.length > 0) {
                    linhaAtual = linhaAtual.slice(0, -1);
                    terminal.write('\b \b');
                }
            } else {
                linhaAtual += press;
                terminal.write(press);
            }
        });
    </script>
</body>
</html>
