<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Terminal de Contenção O5</title>
    
    <!-- Importando o núcleo visual do xterm.js da nuvem -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    
    <style>
        /* 1. O ABISMO NEGRO (Fundo e Tipografia) */
        body {
            margin: 0;
            background-color: #050505; /* Preto quase absoluto */
            color: #ffb000; /* O clássico Âmbar de terminais militares */
            font-family: 'Courier New', monospace; /* Fonte monoespaçada de sistema */
            display: flex;
            height: 100vh;
            overflow: hidden; /* Impede a rolagem, prende o usuário na tela */
        }

        /* 2. GEOMETRIA SAGRADA: O Layout Divino */
        #sistema-operacional {
            display: flex;
            width: 100vw;
        }

        /* O Terminal Principal recebe exatamente 61.8% do espaço (Proporção Áurea) */
        #zona-terminal {
            width: 61.8vw; 
            padding: 34px; /* Fibonacci: 34px */
            box-shadow: inset 0 0 55px rgba(255, 176, 0, 0.05); /* Fibonacci: 55px */
        }

        /* O Painel Lateral recebe os 38.2% restantes */
        #zona-anomalia {
            width: 38.2vw; 
            border-left: 1px solid rgba(255, 176, 0, 0.3);
            padding: 21px; /* Fibonacci: 21px */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 3. A ESTÉTICA DO SOBRENATURAL */
        h1 {
            font-size: 55px; /* Fibonacci */
            letter-spacing: 8px; /* Fibonacci */
            margin: 0;
            text-transform: uppercase;
            animation: pulsacao-divina 1.618s infinite alternate; /* O tempo do pulso usa o valor de Phi */
        }

        .texto-sistema {
            font-size: 13px; /* Fibonacci */
            line-height: 1.618; /* A altura da linha das letras é regida por Phi */
            text-align: center;
            color: #885d00;
        }

        /* O Glitch matemático (simulando instabilidade da contenção) */
        @keyframes pulsacao-divina {
            0% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; opacity: 0.9; }
            50% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; opacity: 1.0; }
            100% { text-shadow: 2px 0 #ffb000, -2px 0 #ffb000; opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="sistema-operacional">
        <!-- Aqui é onde o terminal real será injetado pelo JavaScript -->
        <div id="zona-terminal"></div>
        
        <!-- Área lateral para exibir fotos e status das anomalias no futuro -->
        <div id="zona-anomalia">
            <h1>ANOMALIA OS</h1>
            <p class="texto-sistema">
                GEOMETRIA DE CONTENÇÃO ATIVA<br>
                CÓDIGO DE SEQUÊNCIA: 8, 13, 21, 34, 55<br>
                PROPORÇÃO DE REALIDADE: 1.618033
            </p>
        </div>
    </div>

    <!-- Importando o motor do xterm.js -->
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    
    <script>
        /* A ENGENHARIA DO XTERM.JS */
        // 1. Criamos a "máquina" do terminal virtual
        const terminal = new Terminal({
            cursorBlink: true, // Faz o cursor piscar
            cursorStyle: 'block',
            fontSize: 21, // Fibonacci
            fontFamily: 'Courier New',
            theme: {
                background: '#050505',
                foreground: '#ffb000',
                cursor: '#ffb000'
            }
        });

        // 2. Acoplamos a máquina à nossa zona invisível no HTML
        terminal.open(document.getElementById('zona-terminal'));

        // 3. O Diálogo Inicial (Quando a página carrega)
        terminal.writeln('Iniciando sequência de ancoragem de realidade...');
        terminal.writeln('\x1b[31m[AVISO] ALINHAMENTO MATEMÁTICO PHI ESTABELECIDO.\x1b[0m'); // \x1b[31m muda a cor para vermelho
        terminal.writeln('Aguardando input do operador...');
        terminal.write('\r\n>_ '); // O \r\n quebra a linha para o usuário digitar

        // 4. Lógica Básica de Eco (Permite ao usuário escrever e dar Enter)
        let linhaAtual = '';
        terminal.onKey(e => {
            const press = e.key;
            const ev = e.domEvent;

            // Se o usuário apertar 'Enter'
            if (ev.keyCode === 13) {
                terminal.write('\r\n'); // Pula linha
                
                // Futuramente, é aqui que enviaremos a palavra (ex: SCP-002) para o Django
                terminal.writeln('\x1b[33mBuscando entidade: ' + linhaAtual + '\x1b[0m'); 
                
                linhaAtual = ''; // Limpa a memória
                terminal.write('\r\n>_ ');
            } 
            // Se apertar 'Backspace'
            else if (ev.keyCode === 8) {
                if (linhaAtual.length > 0) {
                    linhaAtual = linhaAtual.slice(0, -1);
                    terminal.write('\b \b');
                }
            } 
            // Teclas normais sendo digitadas
            else {
                linhaAtual += press;
                terminal.write(press);
            }
        });
    </script>
</body>
</html>
